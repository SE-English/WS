    }

    .tab-button.active {
      background: linear-gradient(135deg, #0A7D6A, #A7D8BA);
      color: white;
    }

      background: rgba(10, 125, 106, 0.1);
      transform: translateY(-2px);

      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;

    .quiz-option {
      transition: all 0.3s ease;
      cursor: pointer;
      border: 2px solid #e5e7eb;
    }

    .quiz-option:hover:not(.correct):not(.wrong):not(.disabled) {

<body class="bg-background min-h-screen">
  <!-- 头部 -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-4">
      <h1 class="text-3xl font-bold text-center"
        style="background: linear-gradient(135deg, #0A7D6A, #A7D8BA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
        英语时态互动学习 📚
      </h1>
      <p class="text-center text-gray-600 mt-2">掌握10大时态，轻松应对英语考试</p>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="container mx-auto px-4 py-8">
    <!-- 进度条 -->
    <div class="mb-8 content-card p-6">
      <div class="flex justify-between items-center mb-2">
        <span class="text-foreground font-semibold">学习进度</span>
        <span class="text-primary font-bold" id="progressText">0/10</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3">
        <div class="progress-bar h-3 rounded-full" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- 时态导航标签 -->
    <div class="mb-6 overflow-x-auto">
      <div class="flex gap-2 min-w-max pb-2">
        <button class="tab-button active px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-continuous">过去进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-perfect">过去完成时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-future">过去将来时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-perfect-continuous">过去完成进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-future-continuous">过去将来进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="future-continuous">将来进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-future-perfect">过去将来完成时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="past-future-perfect-continuous">过去将来完成进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="future-perfect-continuous">将来完成进行时</button>
        <button class="tab-button px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap"
          data-tense="present-perfect">现在完成时</button>
      </div>
    </div>

    <!-- 时态内容区 -->
    <div id="tenseContent" class="content-card p-8 fade-in">
      <div class="fade-in">
        <h2 class="text-2xl font-bold text-foreground mb-6">过去进行时</h2>

        <!-- 知识点图片 -->
        <div class="mb-8">
          <img src="https://musk-online.fbcontent.cn/pub-musk-ai-studio/user/upload/20/qqdMwxKm4jMmQWmN3rpsrU.jpeg"
            alt="过去进行时" class="tense-image mx-auto">
        </div>

        <!-- 互动练习 -->
        <div class="bg-gradient-to-r from-blue-50 to-teal-50 rounded-2xl p-6">
          <h3 class="text-xl font-semibold text-foreground mb-4">📝 互动练习</h3>
          <p class="text-lg text-foreground mb-4">选择正确的过去进行时句子：</p>

          <div class="space-y-3" id="quizOptions">

            <div class="quiz-option p-4 rounded-lg bg-white" data-index="0">
              <span class="font-medium">A. I was watching TV at 8 yesterday.</span>
            </div>

            <div class="quiz-option p-4 rounded-lg bg-white" data-index="1">
              <span class="font-medium">B. I watch TV at 8 yesterday.</span>
            </div>

            <div class="quiz-option p-4 rounded-lg bg-white" data-index="2">
              <span class="font-medium">C. I am watching TV at 8 yesterday.</span>
            </div>

            <div class="quiz-option p-4 rounded-lg bg-white" data-index="3">
              <span class="font-medium">D. I watched TV at 8 yesterday.</span>
            </div>

          </div>

          <div id="feedback" class="mt-6 hidden">
            <div class="p-4 rounded-lg">
              <p class="text-lg font-semibold"></p>
            </div>
          </div>

          <button id="nextBtn" class="btn-primary text-white px-6 py-3 rounded-lg font-semibold mt-6 hidden">
            下一个时态 →
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    // 时态数据配置
    const tenseData = {
      'past-continuous': {
        name: '过去进行时',
        image: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/user/upload/20/qqdMwxKm4jMmQWmN3rpsrU.jpeg',
        quiz: {
          question: '选择正确的过去进行时句子：',
          options: [
            'I was watching TV at 8 yesterday.',
            'I watch TV at 8 yesterday.',
            'I am watching TV at 8 yesterday.',
            'I watched TV at 8 yesterday.'
          ],
          correct: 0
        }
      },
      'past-perfect': {
        name: '过去完成时',
        image: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/user/upload/20/itNQt6MQTiQQHVn3gazCmi.jpeg',
        quiz: {
          question: '下列哪个句子正确使用了过去完成时？',
          options: [
            'By the time I got home, my mom cooked dinner.',
            'By the time I got home, my mom had cooked dinner.',
            'By the time I got home, my mom has cooked dinner.',
            'By the time I got home, my mom was cooking dinner.'
          ],
          correct: 1
        }
      },
      'past-future': {
        name: '过去将来时',
        image: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/user/upload/20/zqu6qZM4z2PXc9SMxwLXpC.jpeg',
        quiz: {
          question: '他说他明天会来。正确的英文表达是：',
          options: [
            'He said he will come tomorrow.',
            'He said he would come tomorrow.',
            'He says he would come tomorrow.',
            'He said he comes tomorrow.'
          ],

    // 状态管理
    let currentTense = 'past-continuous';
    let completedTenses = new Set();

    // 初始化
    function init() {
      renderContent(currentTense);
      setupTabListeners();
      updateProgress();
    }

    // 渲染内容
    function renderContent(tenseKey) {
      const data = tenseData[tenseKey];
      const content = document.getElementById('tenseContent');

      content.innerHTML = `
        <div class="fade-in">
          <h2 class="text-2xl font-bold text-foreground mb-6">${data.name}</h2>
          
          <!-- 知识点图片 -->
          <div class="mb-8">
            <img src="${data.image}" alt="${data.name}" class="tense-image mx-auto">
          </div>
          
          <!-- 互动练习 -->
          <div class="bg-gradient-to-r from-blue-50 to-teal-50 rounded-2xl p-6">
            <h3 class="text-xl font-semibold text-foreground mb-4">📝 互动练习</h3>
            <p class="text-lg text-foreground mb-4">${data.quiz.question}</p>
            
            <div class="space-y-3" id="quizOptions">
              ${data.quiz.options.map((option, index) => `
                <div class="quiz-option p-4 rounded-lg bg-white" data-index="${index}">
                  <span class="font-medium">${String.fromCharCode(65 + index)}. ${option}</span>
                </div>
              `).join('')}
            </div>
            
            <div id="feedback" class="mt-6 hidden">
              <div class="p-4 rounded-lg">
                <p class="text-lg font-semibold"></p>
              </div>
            </div>
            
            <button id="nextBtn" class="btn-primary text-white px-6 py-3 rounded-lg font-semibold mt-6 hidden">
              下一个时态 →
            </button>
          </div>
        </div>
      `;

      setupQuizListeners(tenseKey, data.quiz.correct);
    }

    // 设置答题监听
    function setupQuizListeners(tenseKey, correctIndex) {
      const options = document.querySelectorAll('.quiz-option');
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('nextBtn');

      options.forEach((option, index) => {
        option.addEventListener('click', () => {
          if (option.classList.contains('disabled')) return;

          // 禁用所有选项
          options.forEach(opt => opt.classList.add('disabled'));

          // 显示反馈
          if (index === correctIndex) {
            option.classList.add('correct');
            feedback.querySelector('p').textContent = '✅ 回答正确！太棒了！';
            feedback.querySelector('div').className = 'p-4 rounded-lg bg-green-100 border-2 border-green-500';
            feedback.classList.remove('hidden');

            // 标记完成
            completedTenses.add(tenseKey);
            updateProgress();

            // 显示下一题按钮
            if (completedTenses.size < Object.keys(tenseData).length) {
              nextBtn.classList.remove('hidden');
            } else {
              nextBtn.textContent = '🎉 恭喜完成所有时态学习！';
              nextBtn.classList.remove('hidden');
              nextBtn.onclick = () => {
                alert('恭喜你完成了所有10个时态的学习！继续加油！💪');
              };
            }
          } else {
            option.classList.add('wrong');
            options[correctIndex].classList.add('correct');
            feedback.querySelector('p').textContent = '❌ 答案错误，正确答案已标出，再看看知识点吧！';
            feedback.querySelector('div').className = 'p-4 rounded-lg bg-red-100 border-2 border-red-500';
            feedback.classList.remove('hidden');
          }
        });
      });

      // 下一题按钮
      nextBtn.addEventListener('click', () => {
        const tenseKeys = Object.keys(tenseData);
        const currentIndex = tenseKeys.indexOf(tenseKey);
        const nextIndex = (currentIndex + 1) % tenseKeys.length;
        const nextTense = tenseKeys[nextIndex];

        // 切换标签
        document.querySelectorAll('.tab-button').forEach(btn => {
          btn.classList.remove('active');
          if (btn.dataset.tense === nextTense) {
            btn.classList.add('active');
          }
        });

        currentTense = nextTense;
        renderContent(nextTense);
      });
    }

    // 设置标签监听
    function setupTabListeners() {
      const tabs = document.querySelectorAll('.tab-button');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTense = tab.dataset.tense;
          renderContent(currentTense);
        });
      });
    }

    // 更新进度
    function updateProgress() {
      const total = Object.keys(tenseData).length;
      const completed = completedTenses.size;
      const percentage = (completed / total) * 100;

      document.getElementById('progressText').textContent = `${completed}/${total}`;
      document.getElementById('progressBar').style.width = `${percentage}%`;
    }

    // 启动应用
    init();
  </script>
