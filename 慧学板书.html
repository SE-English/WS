  :root{
    --ink:#2b2b2b;
    --paper:#fbf7ee;
    --line:#d9cdb4;
    --accent:#8a5fc0;
    --red:#b3452e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,#e8e4f5 0%,#f3efe6 55%,#e6efe8 100%);
    color:var(--ink);overflow:hidden;
  }
  #app{display:flex;height:100vh}

  /* ============ 左侧便签栏 ============ */
  #sidebar{
    width:270px;flex-shrink:0;display:flex;flex-direction:column;
    background:rgba(255,255,255,.55);backdrop-filter:blur(8px);
    border-right:1px solid rgba(0,0,0,.08);
  }
  .side-head{
    padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  }
  .side-head h2{font-size:15px;letter-spacing:2px;color:#5a4a78}
  #addNote{
    border:none;background:linear-gradient(135deg,#8a5fc0,#b3452e);
    color:#fff;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;
    box-shadow:0 2px 6px rgba(90,60,140,.35);transition:transform .15s;
  }
  #addNote:hover{transform:translateY(-1px)}
  #noteList{flex:1;overflow-y:auto;padding:6px 14px 20px}
  #noteList::-webkit-scrollbar{width:6px}
  #noteList::-webkit-scrollbar-thumb{background:#c9bfe0;border-radius:3px}

  .sticky{
    position:relative;margin:14px 2px;padding:12px 12px 10px;cursor:pointer;
    border-radius:2px 2px 8px 2px;min-height:92px;
    box-shadow:2px 4px 10px rgba(80,60,40,.18);
    transition:transform .18s,box-shadow .18s;
    font-family:"Kaiti SC","KaiTi","楷体",serif;
  }
  .sticky::before{ /* 胶带 */
    content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);
    width:64px;height:16px;background:rgba(255,255,255,.55);
    border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .sticky::after{ /* 折角 */
    content:"";position:absolute;right:0;bottom:0;width:0;height:0;
    border-style:solid;border-width:0 0 16px 16px;
    border-color:transparent transparent rgba(0,0,0,.12) transparent;
  }
  .sticky:nth-child(odd){transform:rotate(-1.2deg)}
  .sticky:nth-child(even){transform:rotate(1.1deg)}
  .sticky:hover{transform:rotate(0) scale(1.02);box-shadow:3px 6px 16px rgba(80,60,40,.28)}
  .sticky.active{
    transform:rotate(0) scale(1.03);outline:2px solid #8a5fc0;outline-offset:2px;
    box-shadow:3px 7px 18px rgba(90,60,140,.3);
  }
  .sticky .s-title{font-weight:700;font-size:14px;margin-bottom:4px;color:#3a3020;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sticky .s-preview{font-size:12px;color:#5c5240;line-height:1.5;height:38px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sticky .s-date{font-size:10px;color:rgba(60,50,30,.5);margin-top:5px;font-family:sans-serif}
  .sticky .s-del{
    position:absolute;top:4px;right:4px;width:18px;height:18px;border:none;border-radius:50%;
    background:rgba(0,0,0,.08);color:#6b5b3a;font-size:11px;line-height:18px;cursor:pointer;
    opacity:0;transition:opacity .15s;
  }
  .sticky:hover .s-del{opacity:1}
  .sticky .s-del:hover{background:rgba(179,69,46,.85);color:#fff}
  .s-colors{display:flex;gap:5px;margin-top:6px}
  .s-colors i{width:13px;height:13px;border-radius:50%;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .12s}
  .s-colors i:hover{transform:scale(1.25)}
  .s-colors i.on{outline:2px solid #555;outline-offset:1px}

  /* ============ 主区域 ============ */
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden}

  /* 工具栏 */
  #toolbar{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:9px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(0,0,0,.08);box-shadow:0 1px 8px rgba(0,0,0,.05);
  }
  .tgroup{display:flex;align-items:center;gap:4px;padding:2px 8px;border-right:1px dashed #cfc4dd}
  .tgroup:last-child{border-right:none;margin-left:auto}
  .tlabel{font-size:11px;color:#9a8ab5;margin-right:2px}
  .tbtn{
    min-width:30px;height:30px;border:1px solid transparent;border-radius:7px;background:transparent;
    cursor:pointer;font-size:14px;color:#443a55;display:flex;align-items:center;justify-content:center;
    padding:0 8px;transition:all .12s;font-family:Georgia,serif;
  }
  .tbtn:hover{background:#efe8f8;border-color:#cdbfe4}
  .tbtn:active{transform:scale(.93)}
  .tbtn.b{font-weight:900}
  .tbtn.i{font-style:italic;font-family:Georgia,serif}
  .tbtn.u{text-decoration:underline}
  .tbtn.s{text-decoration:line-through}
  .tselect{height:30px;border:1px solid #d9c7a3;border-radius:7px;background:#fffdf7;color:#5a4a2e;font-size:13px;padding:0 4px;margin-left:2px;cursor:pointer;font-family:inherit}
  .tselect:hover{background:#fbf3e2;border-color:#cdbfe4}
  /* 重要性符号按钮 */
  .tbtn.sym{font-size:17px;min-width:32px;padding:0 4px;line-height:1}
  .tbtn.sym.active{background:#ffe1e1;border-color:#e2a0a0;color:#b3271f}
  /* 文字标记（框 / 圈 / 箭头） */
  .mk-box{display:inline-block;border:2px solid #b3452e;border-radius:4px;padding:0 4px;line-height:1.4}
  .mk-circle{display:inline-block;border:2px solid #b3452e;border-radius:999px;padding:0 7px;line-height:1.45}
  .mk-arrow{color:#b3452e;font-weight:700;margin-right:1px}
  .mk-ipa,.mk-pos,.mk-mean{font-family:"Times New Roman",宋体,serif}
  /* 拖动移动文字 */
  #dragGhost{position:fixed;z-index:999;pointer-events:none;opacity:.9;background:#fffbe9;
    border:1px dashed #b3452e;border-radius:4px;padding:2px 8px;color:#b3452e;
    font:14px/1.5 "Times New Roman",宋体,serif;max-width:340px;white-space:pre-wrap}
  body.dragging-text{user-select:none;-webkit-user-select:none;cursor:grabbing}
  /* 上传说明 */
  .up-steps{background:#fbf7ef;border:1px dashed #d8c9a8;border-radius:8px;padding:10px 13px;margin:2px 0 12px;
    font-size:12px;line-height:1.85;color:#5d5443}
  .up-steps b{color:#8a6d3b}
  .up-pick{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .up-pick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
  .up-pick-btn{display:inline-block;padding:7px 16px;border:1px solid #cdbfe4;border-radius:8px;
    background:#f5eefc;color:#5a3f86;cursor:pointer;font-size:13px}
  .up-pick input[type=file]:focus-visible + .up-pick-btn{outline:2px solid #b89fdd}
  .up-file-name{font-size:12px;color:#7a7160;word-break:break-all}
  .sym-mark{color:#c0392b;font-weight:700;font-size:1.25em;line-height:1;padding:0 1px}
  /* 全屏演示模式 */
  #fsExit{display:none;position:fixed;right:16px;top:14px;z-index:60;align-items:center;gap:6px;
    height:34px;padding:0 14px;border:1px solid #d9c7a3;border-radius:18px;background:#fffdf7;
    color:#5a4a2e;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(80,60,40,.22);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  #fsExit:hover{background:#fbf3e2;border-color:#cdbfe4}
  body.fs-mode #fsExit{display:flex}
  body.fs-mode #sidebar,body.fs-mode #toolbar{display:none}
  body.fs-mode #scroller{padding:10px 12px 24px}
  body.fs-mode .page{max-width:none;box-shadow:none;border-radius:0;padding:22px 30px 30px}
  .tbtn.wide{font-size:12px;font-family:"PingFang SC","Microsoft YaHei"}
  .tbtn.br{font-size:16px;font-weight:700;letter-spacing:1px}
  .tbtn.wavybtn{
    font-family:"Kaiti SC","KaiTi",serif;font-size:13px;color:#b3452e;font-weight:700;
    text-decoration:underline wavy #b3452e 1.5px;text-underline-offset:4px;
  }
  input[type=color]{
    width:26px;height:26px;border:1px solid #d5c9e8;border-radius:6px;cursor:pointer;
    padding:1px;background:#fff;
  }

  /* 书页 */
  #scroller{flex:1;overflow-y:auto;padding:22px 30px 60px}
  #scroller::-webkit-scrollbar{width:9px}
  #scroller::-webkit-scrollbar-thumb{background:#cfc2b0;border-radius:5px}
  .page{
    max-width:980px;margin:0 auto;background:var(--paper);
    border-radius:6px;padding:34px 46px 46px;position:relative;
    box-shadow:0 4px 24px rgba(90,70,40,.16),0 1px 3px rgba(0,0,0,.08);
    background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(160,140,100,.07) 31px,rgba(160,140,100,.07) 32px);
  }
  .page::before,.page::after{ /* 装订孔 */
    content:"";position:absolute;left:18px;width:9px;height:9px;border-radius:50%;
    background:#e2d8c2;box-shadow:inset 1px 1px 2px rgba(0,0,0,.18);
  }
  .page::before{top:60px}.page::after{top:120px}

  .page-title{
    text-align:center;font-size:24px;font-weight:700;letter-spacing:4px;
    font-family:"Kaiti SC","KaiTi","楷体",serif;color:#3d3226;margin-bottom:6px;
    display:flex;align-items:center;justify-content:center;gap:14px;
  }
  .page-title .dots{color:#b9a97f;font-size:14px;letter-spacing:3px;user-select:none}
  #noteTitle{outline:none;min-width:120px;border-bottom:1px dashed transparent;padding:0 8px}
  #noteTitle:hover,#noteTitle:focus{border-bottom-color:#b9a97f;background:rgba(255,255,255,.6)}
  .page-sub{text-align:center;font-size:11px;color:#a0926f;letter-spacing:2px;margin-bottom:22px;user-select:none}

  /* 模块 */
  .module{margin:18px 0}
  .mod-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .badge{
    width:26px;height:26px;border-radius:6px;color:#fff;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:"Kaiti SC","KaiTi",serif;
    background:var(--mac);box-shadow:1px 2px 4px rgba(0,0,0,.18);flex-shrink:0;
  }
  .mod-name{
    font-size:16px;font-weight:700;color:var(--mac);letter-spacing:2px;
    font-family:"Kaiti SC","KaiTi","楷体",serif;
  }
  .mod-line{flex:1;height:1px;background:linear-gradient(90deg,var(--mac),transparent);opacity:.4}
  .mod-clear{border:1px solid rgba(0,0,0,.16);background:rgba(255,255,255,.72);color:#8a7a60;
    font-size:12px;line-height:1;padding:5px 10px;border-radius:12px;cursor:pointer;white-space:nowrap;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;transition:.15s}
  .mod-clear:hover{background:#fff;border-color:var(--mac,#7c5cad);color:var(--mac,#7c5cad)}
  .mod-clear:active{transform:translateY(1px)}
  .mod-body{display:flex;gap:0;border-radius:8px;overflow:hidden;
    box-shadow:0 1px 4px rgba(80,60,40,.1)}
  .mod-edit{
    flex:1;min-height:88px;padding:14px 18px;background:var(--mbg);
    outline:none;line-height:1.9;font-size:15.5px;
    font-family:"Times New Roman","宋体",SimSun,serif;
  }
  .mod-edit:focus{box-shadow:inset 0 0 0 2px var(--mac)}
  .mod-edit:empty::before{content:attr(data-ph);color:rgba(0,0,0,.32);font-family:"PingFang SC","Microsoft YaHei"}
  .gutter{
    width:118px;flex-shrink:0;padding:10px 8px;outline:none;font-size:12.5px;line-height:1.7;
    background:repeating-linear-gradient(0deg,#fdfaf2,#fdfaf2 21px,#e8ddc4 21px,#e8ddc4 22px);
    border-left:1px dashed rgba(0,0,0,.15);color:#4a4232;
    font-family:"Kaiti SC","KaiTi","楷体",cursive;
  }
  .gutter:empty::before{content:"✎ 标注区";color:rgba(0,0,0,.28)}
  .gutter:focus{box-shadow:inset 0 0 0 2px rgba(138,95,192,.35)}
  .gutter-label{
    font-size:10px;color:#8d7c56;text-align:center;letter-spacing:2px;padding:3px 0 5px;
    background:#f3ecd9;border-left:1px dashed rgba(0,0,0,.15);user-select:none;
  }

  /* 词条样式（仿教材高亮词条） */
  .entry{
    /* 原来用 display:flex —— 但 flex 容器里按回车只会���卡内插一个 <br>，
       没法新建一行；点模块空白处光标也会被吸进最后一项。
       改成 block + inline 子元素：整张卡就是普通文字流，随便改、随便换行。 */
    display:block;
    background:var(--ec,#eef3fb);border-left:3px solid var(--mac,#7c5cad);
    border-radius:0 8px 8px 0;padding:7px 14px;margin:7px 0;line-height:2;
  }
  .entry>span{display:inline;white-space:nowrap;margin-right:9px}
  .entry>span:last-child{margin-right:0}
  .e-word{font-weight:700;color:var(--red);font-size:1.18em;font-family:"Times New Roman",serif}
  .e-ipa{color:#6f6a5c;font-style:italic;font-family:"Times New Roman",serif}
  .e-pos{color:#8a6d3b;font-style:italic;font-family:"Times New Roman",serif}
  .e-mean{color:#33302a}

  /* 波浪线等标注 */
  .wavy{text-decoration:underline wavy #b3452e 1.8px;text-underline-offset:5px}
  .mark-red{color:#b3452e}

  /* 手写体模式（英语手写，中文回退常规字体） */
  #modules.hand-mode .mod-edit,
  #modules.hand-mode .gutter{
    font-family:'衡水体','Ma Shan Zheng','Comic Sans MS',cursive,"PingFang SC","Microsoft YaHei",SimSun,serif;
    font-size:19px;line-height:1.8;
  }
  .tbtn.active{background:#efe1f5;border-color:#b89fdd;color:#6a3fae}
  .tbtn.undo,.tbtn.redo{font-size:17px;font-weight:700}

  /* toast */
  #toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
    background:rgba(50,40,70,.92);color:#fff;padding:9px 22px;border-radius:24px;
    font-size:13px;transition:transform .3s;z-index:99;pointer-events:none;
  }
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* 学段 / 上传 / 词条弹窗 / 参考资料 */
  .tbtn.lvl.active{background:#e7f0ff;border-color:#7aa7e0;color:#1f5fa8}
  .modal-mask{position:fixed;inset:0;background:rgba(40,30,60,.45);display:none;align-items:center;justify-content:center;z-index:200}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(580px,92vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .modal h3{font-size:17px;margin-bottom:14px;color:#3d3226;display:flex;align-items:center;justify-content:space-between}
  .modal h3 .x{border:none;background:none;font-size:22px;cursor:pointer;color:#999;line-height:1}
  .modal label{display:block;font-size:13px;color:#6a5f4a;margin:12px 0 5px}
  .modal input[type=text],.modal input[type=url],.modal input[type=password],.modal textarea{
    width:100%;padding:9px 11px;border:1px solid #d8cdb6;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box}
  .modal textarea{resize:vertical;min-height:60px}
  .modal .seg{display:flex;gap:8px;margin:6px 0 4px}
  .modal .seg button{flex:1;padding:9px;border:1px solid #d8cdb6;border-radius:8px;background:#faf6ec;cursor:pointer;font-size:14px}
  .modal .seg button.on{background:#8a5fc0;color:#fff;border-color:#8a5fc0}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .modal .actions button{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px}
  .btn-ok{background:#8a5fc0;color:#fff}
  .btn-cancel{background:#eee;color:#555}
  .btn-ai{background:#4e7d43;color:#fff}
  .w-suggest{border:1px solid #e7dfc8;border-radius:8px;margin-top:6px;max-height:200px;overflow:auto;font-size:13.5px}
  .w-suggest div{padding:7px 12px;cursor:pointer;border-bottom:1px solid #f0ead9}
  .w-suggest div:hover,.w-suggest div.sel{background:#efe6f7}
  .w-suggest .ipa{color:#888;font-style:italic;margin-left:6px}
  .w-suggest .m{color:#4a4030;margin-left:6px}
  .w-prev{background:#f7f2e6;border:1px dashed #cdbf9a;border-radius:8px;padding:10px 12px;margin-top:8px;font-family:"Times New Roman",serif;font-size:14px;display:none}
  .w-prev.show{display:block}
  .w-prev b{color:#b3452e}
  .ref-panel{max-width:980px;margin:14px auto 0;background:#fff;border:1px solid #e4dcc6;border-radius:10px;padding:12px 16px;display:none;font-family:"PingFang SC",sans-serif}
  .ref-panel.show{display:block}
  .ref-panel h4{font-size:14px;color:#6a5f4a;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .ref-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #ece3cd;font-size:13px}
  .ref-item:last-child{border-bottom:none}
  .ref-item .tag{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;background:#8a5fc0;white-space:nowrap}
  .ref-item .tag.pep{background:#2f7fc1}
  .ref-item .tag.wy{background:#c2506e}
  .ref-item .nm{flex:1;color:#3d3226;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref-item .del{color:#b3452e;cursor:pointer;border:none;background:none;font-size:12px}
  .ref-empty{color:#9a8f78;font-size:12px}

  @media print{
    #sidebar,#toolbar,.gutter,.gutter-label,#fsExit{display:none!important}
    body{overflow:visible;background:#fff}
    #scroller{overflow:visible;padding:0}
    .page{box-shadow:none;max-width:100%}
    .mod-body{box-shadow:none}
  }

  /* ===== 标注绘制层（箭头/方框/圆圈/橡皮） ===== */
  #annoLayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
  #annoLayer.mode-draw,#annoLayer.mode-erase{pointer-events:auto}
  #annoLayer.mode-draw{cursor:crosshair}
  #annoLayer.mode-draw > *{pointer-events:none}
  #annoLayer.mode-erase .ashape{pointer-events:auto;cursor:pointer}
  #annoLayer .ashape{pointer-events:none}
  /* ===== 行内自动联动词条：纯文本单词就地匹配音标/词性/释义 ===== */
  .wentry{display:inline-block;background:var(--ec,#eef3fb);

  .wentry .we-mean{color:#33302a;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .tbtn.on{background:#e7f3e7;border-color:#9dc79d;color:#2f6b34}
  .tbtn.lock{background:#fdecec;border-color:#e0a0a0;color:#a83232}
  /* 只读模式提示条 */
  #roTip{display:none;position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:58;
    background:#fff4e2;border:1px solid #e6c48c;color:#8a5b12;font-size:12.5px;padding:5px 14px;
    border-radius:16px;box-shadow:0 3px 12px rgba(80,60,40,.16);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  body.readonly #roTip{display:block}
  body.readonly .mod-edit,body.readonly .gutter{cursor:default}
  .tbtn.draw.active{background:#ffe1e1;border-color:#e2a0a0;color:#b3271f}
  #toolEraser.active{background:#ffe1e1;border-color:#e2a0a0;color:#b3271f}
  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;padding:0;flex:0 0 auto}
  .swatch:hover{transform:scale(1.12)}
</style>

<script data-page-node-id="R17Vu1rKW62f0S243PNVh2" data-pnid-children="2egOlx5DSuWKq9miamgWzE">
/* ================= 数据 ================= */
const STORE = 'wb-board-notes-v1';
const NOTE_COLORS = ['#f9e36b','#f7b8c4','#a8d8f0','#b8e6b8','#d8c2f0','#f6c89f'];
const ENTRY_BG = ['#eef3fb','#eaf6ec','#fdf1e3','#f6ecf7','#eef7f7'];
const MODULES = [
  {key:'words', badge:'词', name:'重点词汇', bg:'#fdf8ea', ac:'#b8860b',
   ph:'输入本课重点词汇（每行一个词，停顿片刻即自动匹配音标、例句），也可点「＋ 词条」插入高亮词条…'},
  {key:'collo', badge:'搭', name:'常见搭配', bg:'#eee6f4', ac:'#7c5cad',
   ph:'输入常见搭配，如：remind sb. of sth. 提醒某人某事…'},
  {key:'gram', badge:'法', name:'重点语法', bg:'#fbe9ee', ac:'#c2506e',
   ph:'输入语法要点，可用括号与波浪线做标注…'},
  {key:'ex', badge:'例', name:'配套例句', bg:'#e6f0e4', ac:'#4e7d43',
   ph:'输入教材/真题例句及译文，如：【2024 年苏州卷】…'},
  {key:'test', badge:'测', name:'语法测试', bg:'#f3ede0', ac:'#4a6fa5',
   ph:'输入课堂随测题目…'},
];

let notes = [];
let activeId = null;

function load(){
  try{ notes = JSON.parse(localStorage.getItem(STORE)) || []; }catch(e){ notes = []; }
  if(!notes.length){ notes = [makeNote('第 1 课 · 情感与情绪', true)]; }
  notes.forEach(x=>{ if(!x.anno) x.anno = []; });
  activeId = notes[0].id;
}
function save(){ localStorage.setItem(STORE, JSON.stringify(notes)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function makeNote(title, sample){
  const n = {
    id: uid(), title, color: NOTE_COLORS[notes.length % NOTE_COLORS.length],
    updated: Date.now(),
    modules: {}, gutters: {}, anno: []
  };
  MODULES.forEach(m => n.modules[m.key] = '');
  if(sample){
    n.modules.words =
      '<div class="entry"><span class="e-word">feel</span><span class="e-ipa">/fiːl/</span><span class="e-pos">v.</span><span class="e-mean">感到；觉得；摸，触</span></div>' +
      '<div class="entry" style="--ec:#eaf6ec"><span class="e-word">feeling</span><span class="e-ipa">/ˈfiːlɪŋ/</span><span class="e-pos">n.</span><span class="e-mean">感情；感觉</span></div>' +
      '<div class="entry" style="--ec:#fdf1e3"><span class="e-word">amazing</span><span class="e-ipa">/əˈmeɪzɪŋ/</span><span class="e-pos">adj.</span><span class="e-mean">令人大为惊奇的</span></div>' +
      '<p>提示：选中文字后点击工具栏可<b>加粗</b>、<i>斜体</i>、<span class="wavy">加波浪线</span>、<span class="mark-red">标红</span>；右侧竖线区是<strong>标注区</strong>，可随手写旁注。</p>';
    n.modules.collo =
      '<p>make sense 有道理；讲得通　　common sense 常识</p><p>be excited about… 对……感到兴奋</p>';
    n.modules.ex =
      '<p>We can recharge our batteries with green space time — look for a park, gardens or plants to calm our bodies and <span class="wavy">minds</span>.【2024 年苏州卷】</p><p style="color:#5a6b52">我们可以通过绿色空间来给自己充电——找个公园、花园或有植物的地方，让心灵和身体都平静下来。</p>';
  }
  return n;
}

/* ================= 便签栏 ================= */
const noteList = document.getElementById('noteList');
function stripHtml(html){
  const d = document.createElement('div'); d.innerHTML = html || '';
  return d.textContent.trim().replace(/\s+/g,' ');
}
function renderSidebar(){
  noteList.innerHTML = '';
  notes.forEach(n => {
    const card = document.createElement('div');
    card.className = 'sticky' + (n.id === activeId ? ' active' : '');
    card.style.background = n.color;
    const dots = NOTE_COLORS.map(c =>
      `<i style="background:${c}" class="${c===n.color?'on':''}" data-c="${c}" title="设为该颜色"></i>`).join('');
    card.innerHTML = `
      <button class="s-del" title="删除笔记">✕</button>
      <div class="s-title">${esc(n.title)}</div>
      <div class="s-preview">${esc(stripHtml(n.modules.words).slice(0,50)) || '（空笔记）'}</div>
      <div class="s-date">${new Date(n.updated).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="s-colors">${dots}</div>`;
    card.addEventListener('click', e => {
      if(e.target.classList.contains('s-del')){ delNote(n.id); return; }
      if(e.target.tagName === 'I'){ n.color = e.target.dataset.c; n.updated = Date.now(); save(); renderSidebar(); return; }
      switchNote(n.id);
    });
    noteList.appendChild(card);
  });
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function delNote(id){
  if(notes.length <= 1){ toast('至少保留一份笔记'); return; }
  const n = notes.find(x => x.id === id);
  if(!confirm(`确定删除便签「${n.title}」吗？`)) return;
  flushEdits();
  notes = notes.filter(x => x.id !== id);
  if(activeId === id) activeId = notes[0].id;
  save(); renderSidebar(); renderMain();
  toast('已删除');
}
function switchNote(id){
  if(id === activeId) return;
  flushEdits();
  activeId = id;
  renderSidebar(); renderMain();
  document.getElementById('scroller').scrollTop = 0;
}

document.getElementById('addNote').addEventListener('click', () => {
  flushEdits();
  const n = makeNote(`第 ${notes.length + 1} 课`);
  notes.unshift(n); activeId = n.id;
  save(); renderSidebar(); renderMain();
  toast('已新建便签笔记');
});

/* ================= 标注绘制工具（箭头/方框/圆圈/橡皮）+ 荧光笔 ================= */
const annoLayer = document.getElementById('annoLayer');
let drawTool = null, drawColor = '#e23b3b', drawing = null;
let drawStartX=0, drawStartY=0, drawMoved=false, drawLastX=0, drawLastY=0;
function renderAnno(){
  Array.from(annoLayer.children).forEach(c=>{ if(c.tagName.toLowerCase()!=='defs') annoLayer.removeChild(c); });
  const n = cur(); if(!n || !n.anno) return;
  n.anno.forEach(s=>annoLayer.appendChild(buildShape(s)));
}
function buildShape(s){
  const W = annoLayer.clientWidth, H = annoLayer.clientHeight, ns='http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns,'g'); g.setAttribute('class','ashape'); g.dataset.sid = s.id;
  if(s.type==='arrow'){
    const x1=s.x1*W,y1=s.y1*H,x2=s.x2*W,y2=s.y2*H;
    const hit=document.createElementNS(ns,'line'); hit.setAttribute('x1',x1);hit.setAttribute('y1',y1);hit.setAttribute('x2',x2);hit.setAttribute('y2',y2);hit.setAttribute('stroke','transparent');hit.setAttribute('stroke-width',16);hit.setAttribute('pointer-events','all'); g.appendChild(hit);
    const ln=document.createElementNS(ns,'line'); ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);ln.setAttribute('stroke',s.color);ln.setAttribute('stroke-width',3);ln.setAttribute('marker-end','url(#annoArrow)'); g.appendChild(ln);
  } else if(s.type==='rect'){
    const x=Math.min(s.x1,s.x2)*W,y=Math.min(s.y1,s.y2)*H,w=Math.abs(s.x2-s.x1)*W,h=Math.abs(s.y2-s.y1)*H;
    const r=document.createElementNS(ns,'rect'); r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('fill','none');r.setAttribute('stroke',s.color);r.setAttribute('stroke-width',3);r.setAttribute('pointer-events','all'); g.appendChild(r);
  } else if(s.type==='ellipse'){
    const cx=((s.x1+s.x2)/2)*W, cy=((s.y1+s.y2)/2)*H, rx=Math.abs(s.x2-s.x1)/2*W, ry=Math.abs(s.y2-s.y1)/2*H;
    const e=document.createElementNS(ns,'ellipse'); e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',rx);e.setAttribute('ry',ry);e.setAttribute('fill','none');e.setAttribute('stroke',s.color);e.setAttribute('stroke-width',3);e.setAttribute('pointer-events','all'); g.appendChild(e);
  }
  return g;
}
function annoPt(e){ const r=annoLayer.getBoundingClientRect(); let x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; return {x:Math.max(0,Math.min(1,x)), y:Math.max(0,Math.min(1,y))}; }
function setDrawTool(t){
  const was = drawTool;
  drawTool=t; drawing=null;
  annoLayer.classList.toggle('mode-draw', !!t && t!=='eraser');
  annoLayer.classList.toggle('mode-erase', t==='eraser');
  ['toolArrow','toolRect','toolEllipse','toolEraser','toolSelect'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(t==='arrow') document.getElementById('toolArrow').classList.add('active');
  if(t==='rect') document.getElementById('toolRect').classList.add('active');
  if(t==='ellipse') document.getElementById('toolEllipse').classList.add('active');
  if(t==='eraser') document.getElementById('toolEraser').classList.add('active');
  if(t && t!=='eraser' && was!==t) toast('标注模式：可在板上拖拽绘制；单击正文或按 Esc 即回到文字编辑');
  if(!t && was) toast('已回到文字编辑，可自由输入');
}
annoLayer.addEventListener('pointerdown', e=>{
  if(!drawTool) return;
  if(drawTool==='eraser'){ const g=e.target.closest('.ashape'); if(g&&g.dataset.sid!=null) removeShape(g.dataset.sid); return; }
  const p=annoPt(e);
  drawing={id:uid(), type:drawTool, x1:p.x,y1:p.y,x2:p.x,y2:p.y,color:drawColor};
  drawStartX=e.clientX; drawStartY=e.clientY; drawMoved=false;
  const g=buildShape(drawing); g.dataset.live='1'; annoLayer.appendChild(g);
  try{ annoLayer.setPointerCapture(e.pointerId); }catch(_){}
});
annoLayer.addEventListener('pointermove', e=>{
  if(!drawing) return;
  if(!drawMoved && Math.abs(e.clientX-drawStartX)<4 && Math.abs(e.clientY-drawStartY)<4) return;
  drawMoved=true;
  const p=annoPt(e); drawing.x2=p.x; drawing.y2=p.y; const old=annoLayer.querySelector('[data-live="1"]'); if(old) old.remove(); const g=buildShape(drawing); g.dataset.live='1'; annoLayer.appendChild(g);
});
function finishDraw(){
  if(!drawing) return;
  const g=annoLayer.querySelector('[data-live="1"]'); if(g) g.remove();
  const dx=Math.abs(drawing.x2-drawing.x1), dy=Math.abs(drawing.y2-drawing.y1);
  /* 单击（几乎没拖动）= 用户其实想编辑正文：退出标注并把光标放到点击处。
     否则标注层会一直盖在正文上，文字就没法再编辑了。 */
  if(!drawMoved && dx<0.004 && dy<0.004){
    drawing=null;
    clickToCaret(drawLastX, drawLastY);
    return;
  }
  if(dx>0.005||dy>0.005){ const n=cur(); n.anno=n.anno||[]; n.anno.push(drawing); save(); annoLayer.appendChild(buildShape(drawing)); }
  drawing=null;
}
annoLayer.addEventListener('pointerup', e=>{ drawLastX=e.clientX; drawLastY=e.clientY; finishDraw(); });
annoLayer.addEventListener('pointercancel', finishDraw);
function removeShape(sid){ const n=cur(); if(!n||!n.anno) return; n.anno=n.anno.filter(s=>s.id!==sid); save(); renderAnno(); toast('已擦除一处标注'); }
document.getElementById('toolSelect').addEventListener('click',()=>setDrawTool(null));
/* 标注模式下单击正文：退出标注，并把光标准确放到点击处（可立即继续输入） */
function clickToCaret(x, y){
  setDrawTool(null);
  let r = null;
  try{
    if(document.caretRangeFromPoint){ r = document.caretRangeFromPoint(x, y); }
    else if(document.caretPositionFromPoint){
      const cp = document.caretPositionFromPoint(x, y);
      if(cp){ r = document.createRange(); r.setStart(cp.offsetNode, cp.offset); r.collapse(true); }
    }
  }catch(_){ r = null; }
  if(!r) return;
  const node = r.startContainer;
  const el = node.nodeType===1 ? node : node.parentElement;
  const host = el && el.closest ? el.closest('.mod-edit, .gutter') : null;
  if(!host) return;
  host.focus();
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
}
/* Esc：先退出标注模式 */
document.addEventListener('keydown', e=>{

/* 箭头/方框/圆圈：若当前选中了文字，就直接给这段文字加标记；
   没有选中文字时，退回自由绘制（在页面上拖拽画图形）。 */
function drawToolClick(kind, drawType){
  const range = pickRange();
  if(range){
    if(kind === 'arrow'){
      const sp = document.createElement('span');
      sp.className = 'mk-arrow';
      sp.textContent = '➤';
      range.insertNode(sp);
      const host = hostOf(range.commonAncestorContainer);
      if(host) saveHost(host);
      toast('已在选中文字前加上箭头');
      return;
    }
    const cls = kind === 'box' ? 'mk-box' : 'mk-circle';
    const spans = wrapRangeText(range, sp => { sp.className = cls; });
    if(spans.length){
      const host = hostOf(range.commonAncestorContainer);
      if(host) saveHost(host);
      toast(kind === 'box' ? '已给选中文字加方框' : '已给选中文字加圈');
      return;
    }
  }
  setDrawTool(drawType);
  toast('在板书上拖拽即可绘制；选中文字后点本按钮可直接加标记');
}

/* 编辑 / 只读切换：只读时板书不会被误改（适合投影讲解），点一下立刻回到编辑 */
const editModeBtn = document.getElementById('editModeBtn');

function cur(){ return notes.find(n => n.id === activeId); }

let saveTimer = null;
function touch(fn){

/* 立刻把正在编辑的内容写回数据。
   任何会重建 #modules 的操作（联动、切便签、删便签、新建便签）之前都要先调用，
   否则"输入"的结果会被后来的重建冲掉。 */
function flushEdits(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  const n = cur();
  if(!n || !modulesEl) return;
  modulesEl.querySelectorAll('.mod-edit').forEach(el=>{ n.modules[el.dataset.key] = el.innerHTML; });
  modulesEl.querySelectorAll('.gutter').forEach(el=>{ n.gutters[el.dataset.gkey] = el.innerHTML; });

}
titleEl.addEventListener('input', () => touch(() => { cur().title = titleEl.textContent.trim() || '未命名'; }));
titleEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); titleEl.blur(); } });

modulesEl.addEventListener('input', e => {
  const n = cur();
  const edit = e.target.closest('.mod-edit');
  const gut  = e.target.closest('.gutter');
  /* 关键：回调里按 key 重新查询"当前"的 DOM 节点，而不是用 input 当时捕获的旧节点。
     旧节点在联动/切便签重建 DOM 后已经脱离文档，用它会把新内容覆盖成旧内容。 */
  if(edit){ const k = edit.dataset.key; touch(() => { const el = modulesEl.querySelector('.mod-edit[data-key="'+k+'"]'); if(!el) return; cleanEmptyShells(el); n.modules[k] = el.innerHTML; }); }
  if(gut){ const k = gut.dataset.gkey; touch(() => { const el = modulesEl.querySelector('.gutter[data-gkey="'+k+'"]'); if(el) n.gutters[k] = el.innerHTML; }); }
});

/* ===== 清空某一栏（重点词汇 / 常见搭配 / …） =====
   「重点词汇」这一栏之前清不掉：删完会剩下一张空的词条卡（734×49 的空色条），
   而且占位提示永远不出现，看着像"不能编辑"。这里做一次彻底清空。 */
function clearModule(key){
  const n = cur();
  if(!n) return;
  const mod = MODULES.filter(m=>m.key===key)[0];
  const name = mod ? mod.name : key;
  const hasAuto = Object.keys(n.modules||{}).some(k =>
    (n.modules[k]||'').indexOf('data-lk')>=0);
  const tip = '确定清空「'+name+'」这一栏吗？'
    + (hasAuto ? '\n\n（由重点词汇自动联动生成到其它栏的内容也会一并移除）' : '');
  if(!confirm(tip)) return;
  n.modules[key] = '';
  save();
  renderMain();
  const el = modulesEl.querySelector('.mod-edit[data-key="'+key+'"]');
  if(el){ el.focus(); }
  toast('已清空「'+name+'」');
}
/* 事件委托：点标题栏上的「🧹 清空本栏」 */
modulesEl.addEventListener('click', e => {

  if(!btn) return;

  clearModule(btn.dataset.mk);

/* 删空后清掉"空壳"：只剩 <br> 的词条卡 / 行内词条，
   否则整栏看着还有内容（一条空色条），占位提示也不出现。 */
function cleanEmptyShells(host){
  if(!host) return false;
  let changed = false;
  const sel = window.getSelection();
  const curRange = () => (sel && sel.rangeCount) ? sel.getRangeAt(0) : null;
  const inSel = node => {
    const r = curRange();
    if(!r) return false;
    return node.contains(r.startContainer) || node.contains(r.endContainer);
  };
  /* 1) 空词条卡 / 空行内词条 → 删
        判据只看有没有文字：卡里只剩一个 <br> 同样算空，
        否则 Ctrl+A+Delete 后会残留一条 734x49 的空色条。 */
  const isEmptyChip = el => !el.textContent.replace(/\u00a0/g,' ').trim()
                            && !el.querySelector('img,svg,video,audio');
  const shells = Array.from(host.querySelectorAll('.entry, .wentry')).filter(isEmptyChip);
  if(shells.length){
    const caretInside = shells.some(inSel);
    shells.forEach(el => el.remove());
    changed = true;
    if(caretInside && sel){
      const r = document.createRange();
      r.selectNodeContents(host); r.collapse(false);
      sel.removeAllRanges(); sel.addRange(r);
    }
  }
  /* 2) 整栏没文字 → 去掉空块，让 :empty 占位提示能显示 */
  if(!host.textContent.trim()){
    Array.from(host.children).forEach(el=>{
      if(el.textContent.trim()) return;
      if(el.querySelector('img,svg,video,audio')) return;
      el.remove(); changed = true;
    });
  }
  return changed;
}

/* 拆分时剔除空的行内元素。
   关键：<p><span></span></p> 这种"空壳段落"会让 Chrome 认为光标位置无效，
   之后打的字会跑到下一个元素里去（实测会跑进下一张词条卡）。必须清干净。 */
function pruneEmptyInline(frag){
  Array.from(frag.querySelectorAll('span,b,i,em,strong,u,font')).forEach(el=>{
    if(el.textContent.replace(/\u00a0/g,' ').trim()) return;
    if(el.querySelector('img,svg,br')) return;
    el.remove();
  });
  return frag;
}
/* 把光标放到某个元素里最前面的可编辑位置 */
function caretToStart(el, sel){
  const r = document.createRange();
  const first = el.firstChild;
  if(first && first.nodeType === 3) r.setStart(first, 0);
  else r.setStart(el, 0);
  r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
}
/* 在词条卡里按回车 → 在卡后面新建一行（而不是在卡里塞一个空 span） */
function splitLineAfterCaret(host, range, chipEl){
  const sel = window.getSelection();
  if(!sel) return false;
  /* 行内词条(.wentry)：原生回车会丢光标，这里自己插一个 <br> 换行 */
  if(chipEl && chipEl.classList.contains('wentry')){
    const parent = chipEl.parentNode;
    if(!parent) return false;
    const br = document.createElement('br');
    parent.insertBefore(br, chipEl.nextSibling);
    const r2 = document.createRange();
    r2.setStartAfter(br); r2.collapse(true);
    sel.removeAllRanges(); sel.addRange(r2);
    return true;
  }
  /* 块级词条卡(.entry)：卡片之后的剩余内容挪到新的一段 */
  let line = range.startContainer;
  if(line.nodeType !== 1) line = line.parentNode;
  while(line && line.parentNode !== host) line = line.parentNode;
  if(!line || line === host) return false;
  const box = chipEl || line;
  const after = document.createRange();
  after.setStart(range.startContainer, range.startOffset);
  after.setEnd(box, box.childNodes.length);
  const frag = pruneEmptyInline(after.extractContents());
  const nb = document.createElement('p');
  if(frag.textContent.replace(/\u00a0/g,' ').trim() || frag.querySelector('img,svg,br')){
    nb.appendChild(frag);
  }else{
    nb.innerHTML = '<br>';
  }
  box.parentNode.insertBefore(nb, box.nextSibling);
  caretToStart(nb, sel);
  return true;
}
modulesEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.isComposing) return;                       /* 中文输入法确认候选，别拦 */
  const host = e.target.closest && e.target.closest('.mod-edit');
  if(!host) return;
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if(!r.collapsed) return;                        /* 有选区 → 走默认行为 */
  const node = r.startContainer;
  const el = node.nodeType === 1 ? node : node.parentElement;
  const chip = el && el.closest ? el.closest('.entry, .wentry') : null;
  if(!chip) return;                               /* 不在词条卡里 → 默认行为 */
  e.preventDefault();
  if(splitLineAfterCaret(host, r, chip)){
    const n = cur();
    const k = host.dataset.key;
    n.modules[k] = host.innerHTML;
    save();
    if(k === 'words' && typeof wordsDirty !== 'undefined') wordsDirty = true;
  }
});

/* ===== 选区工具：跨浏览器保住选区 =====
   点击工具栏控件会让正文失焦，浏览器随即清空选区，
   所以这里在 selectionchange 时记住最近一次有效选区，操作时再还原。 */
let savedRange = null;
function hostOf(node){
  const el = (node && node.nodeType===1) ? node : (node ? node.parentElement : null);
  return (el && el.closest) ? el.closest('.mod-edit, .gutter') : null;
}
document.addEventListener('selectionchange', ()=>{
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if(r.collapsed) return;
  if(hostOf(r.commonAncestorContainer)) savedRange = r.cloneRange();
});
/* 在正文里主动点一下（重新放光标）时丢弃旧选区，避免误操作到过时内容；
   点工具栏不会走到这里，选区得以保留 */
document.addEventListener('pointerdown', e=>{
  if(e.target && e.target.closest && e.target.closest('.mod-edit, .gutter')) savedRange = null;
});
function pickRange(){
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    const r = sel.getRangeAt(0);
    if(hostOf(r.commonAncestorContainer)) return r;
  }
  if(savedRange && document.contains(savedRange.commonAncestorContainer) && hostOf(savedRange.commonAncestorContainer)) return savedRange;
  return null;
}
function saveHost(host){
  const n = cur();
  if(host.classList.contains('gutter')){ const k=host.dataset.gkey; n.gutters[k]=host.innerHTML; }
  else { const k=host.dataset.key; n.modules[k]=host.innerHTML; }
  save();
}

/* 给选区内的文本套上样式：逐个文本节点切分后包裹，
   不改动段落结构（extractContents/insertNode 会破坏 <p> 层级）。
   wrapFn(span) 负责设置 span 的 class / style；
   skipFn(node) 返回 true 表示该文本节点跳过（用于避免重复包裹）。 */
function rangeTextTargets(range){
  const root = range.commonAncestorContainer;
  const base = root.nodeType===3 ? root.parentNode : root;
  if(!base || !base.ownerDocument) return {base:null, targets:[]};
  const walker = base.ownerDocument.createTreeWalker(base, NodeFilter.SHOW_TEXT, null);
  const targets = [];
  let n;
  while((n = walker.nextNode())){
    const len = n.nodeValue.length;
    if(!len) continue;
    if(range.comparePoint(n, 0) > 0) continue;                 // 整段在选区之后
    if(range.comparePoint(n, len) < 0) continue;               // 整段在选区之前
    let s = 0, e = len;
    if(range.startContainer === n) s = range.startOffset;
    if(range.endContainer === n) e = range.endOffset;
    if(e > s) targets.push({node:n, s, e});
  }
  return {base, targets};
}
function wrapRangeText(range, wrapFn, skipFn){
  const {targets} = rangeTextTargets(range);
  const spans = [];
  targets.slice().reverse().forEach(t=>{                        // 从后往前切分，避免影响前面的偏移
    if(skipFn && skipFn(t.node)) return;
    const node = t.node;
    if(t.e < node.nodeValue.length) node.splitText(t.e);
    let mid = node;
    if(t.s > 0) mid = mid.splitText(t.s);
    const span = document.createElement('span');
    wrapFn(span);
    mid.parentNode.insertBefore(span, mid);
    span.appendChild(mid);
    spans.push(span);
  });
  return spans;
}

/* 该文本节点是否已处于 .wavy 波浪线中 */
function isWavyNode(node, stopAt){
  let p = node.parentElement;
  while(p && p !== stopAt){
    if(p.classList && p.classList.contains('wavy')) return true;
    p = p.parentElement;
  }
  return false;
}
/* 选区文字是否全部已带波浪线 */
function rangeIsWavy(range){
  const {base, targets} = rangeTextTargets(range);
  if(!targets.length) return false;
  const stop = base ? base.parentElement : null;
  return targets.every(t => isWavyNode(t.node, stop));
}
/* 去掉选区内的波浪线：把 .wavy 包裹层拆掉，文字与其它格式保留 */
function unwrapWavy(range){
  const host = hostOf(range.commonAncestorContainer);
  if(!host) return 0;
  const spans = Array.from(host.querySelectorAll('.wavy'));
  let n = 0;
  spans.forEach(sp=>{
    if(!range.intersectsNode(sp)) return;
    const frag = sp.ownerDocument.createDocumentFragment();
    while(sp.firstChild) frag.appendChild(sp.firstChild);
    sp.parentNode.replaceChild(frag, sp);
    n++;
  });
  return n;
}

/* 波浪线：加 / 再点一次取消 */
document.getElementById('wavyBtn').addEventListener('mousedown', e => e.preventDefault());
document.getElementById('wavyBtn').addEventListener('click', () => {
  const range = pickRange();
  if(!range){
    toast('请先选中要加波浪线的文字');
    return;
  }
  const host = hostOf(range.commonAncestorContainer);
  if(!host){ toast('请先在正文或标注区选中文字'); return; }
  if(rangeIsWavy(range)){
    unwrapWavy(range);
    saveHost(host);
    toast('已取消波浪线');
    return;
  }
  const spans = wrapRangeText(range, sp => { sp.className = 'wavy'; },
                             node => isWavyNode(node, host));
  if(!spans.length){ toast('该选区暂不支持，请重新选择'); return; }
  saveHost(host);
  toast('已加波浪线，再点一次可取消');

/* ===== 像 Word 一样拖动移动选中的文字 =====
   选中文本后按住并拖动，即可把这段文字搬到别处（板书里换位置很常用）。 */
const dragState = { active:false, range:null, ghost:null, startX:0, startY:0, host:null, moved:false };
/* ===== 拖动移动（像 Word 一样把选中的文字拖到别处） ===== */
function clearDragGhost(){
  if(dragState.ghost){ dragState.ghost.remove(); dragState.ghost = null; }
  document.body.classList.remove('dragging-text');
}
/* 判断鼠标落点是否在「当前选中的文字」上。
   必须这样判断：原来只要页面上存在选区，随便在别处点一下再动一下鼠标，
   选中的文字就被搬走了 —— 老师想点一下放光标，内容却跑了，看着就像「不能编辑」。
   现在只有「按在选中的字上」才启动拖动，和 Word 的行为一致。 */
function pointOnSelection(range, x, y){
  const rects = range.getClientRects();
  for(let i=0;i<rects.length;i++){
    const r = rects[i];
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
  }
  return false;
}
modulesEl.addEventListener('mousedown', e => {
  if(e.button !== 0) return;
  const host = e.target.closest('.mod-edit, .gutter');
  if(!host) return;
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if(r.collapsed) return;
  if(!host.contains(r.commonAncestorContainer)) return;
  if(!pointOnSelection(r, e.clientX, e.clientY)) return;   /* 按在选区外 → 正常放光标 */
  dragState.active = true;
  dragState.range = r.cloneRange();
  dragState.host = host;
  dragState.startX = e.clientX; dragState.startY = e.clientY;
  dragState.moved = false;
});
/* Chrome 选中文字后拖动会启动它自己的原生拖放（也把文字搬走），
   和我们的自定义拖动同时发生 → 两边互相抵消，文字原地不动。
   这里把原生拖放禁掉，只保留我们自己的实现。 */
document.addEventListener('dragstart', e => {
  if(dragState.active){ e.preventDefault(); }
});
document.addEventListener('mousemove', e => {
  if(!dragState.active) return;
  if(!dragState.moved){
    if(Math.abs(e.clientX - dragState.startX) < 6 && Math.abs(e.clientY - dragState.startY) < 6) return;
    dragState.moved = true;
    const g = document.createElement('div');
    g.id = 'dragGhost';
    g.textContent = dragState.range.toString();
    document.body.appendChild(g);
    dragState.ghost = g;
    document.body.classList.add('dragging-text');
  }
  e.preventDefault();
  dragState.ghost.style.left = (e.clientX + 12) + 'px';
  dragState.ghost.style.top = (e.clientY + 12) + 'px';
});
document.addEventListener('mouseup', e => {
  if(!dragState.active) return;
  const moved = dragState.moved;
  const range = dragState.range, host = dragState.host;
  dragState.active = false; dragState.range = null; dragState.host = null;
  clearDragGhost();
  if(!moved || !range) return;
  e.preventDefault();
  // 找到落点：命中最近的正文块
  let target = document.elementFromPoint(e.clientX, e.clientY);
  let host2 = target && target.closest ? target.closest('.mod-edit, .gutter') : null;
  if(!host2 || !host2.isContentEditable){ toast('请拖到正文或标注区里'); return; }
  // 落点插入位置
  let r2 = null;
  if(document.caretRangeFromPoint){
    r2 = document.caretRangeFromPoint(e.clientX, e.clientY);
  } else if(document.caretPositionFromPoint){
    const cp = document.caretPositionFromPoint(e.clientX, e.clientY);
    if(cp){ r2 = document.createRange(); r2.setStart(cp.offsetNode,cp.offset); r2.collapse(true); }
  }
  if(!r2 || !host2.contains(r2.commonAncestorContainer)){ toast('请拖到正文里再松手'); return; }
  /* 先复制内容插到落点，再删掉原处。
     顺序很重要：先 extractContents 会让 DOM 结构变化，落点 range 失效，
     结果就是"拖了没反应"。 */
  const frag = range.cloneContents();
  r2.insertNode(frag);
  range.deleteContents();
  saveHost(host);
  if(host2 !== host) saveHost(host2);
  toast('已移动选中文字');
});

function getUserDict(){ try{ return JSON.parse(localStorage.getItem('wb-userdict')||'[]'); }catch(e){ return []; } }
function getDict(){ return SEED_DICT.concat(getUserDict()); }
function addUserWord(d){ const u=getUserDict(); u.push(d); localStorage.setItem('wb-userdict', JSON.stringify(u)); }
function queryDict(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return getDict().filter(d => d.w.toLowerCase().includes(q))
    .sort((a,b)=> (a.lv===LEVEL?0:1)-(b.lv===LEVEL?0:1) || a.w.length-b.w.length).slice(0,8);
}

/* —— 学段切换 —— */
function setLevel(lv){
  LEVEL = lv; localStorage.setItem('wb-level', lv);
  document.getElementById('lvlPep').classList.toggle('active', lv==='pep');
  document.getElementById('lvlWy').classList.toggle('active', lv==='wy');
}
document.getElementById('lvlPep').addEventListener('click', ()=>setLevel('pep'));
document.getElementById('lvlWy').addEventListener('click', ()=>setLevel('wy'));
setLevel(LEVEL);

/* —— 词条弹窗（输入单词自动匹配音标/词性/释义） —— */
function openWordModal(){
  const m=document.getElementById('wordMask'); m.classList.add('show');
  const inp=document.getElementById('wInput');
  inp.value=''; selEntry=null;
  document.getElementById('wSuggest').style.display='none';
  document.getElementById('wPrev').classList.remove('show');
  document.getElementById('wManual').style.display='none';
  const tgt=document.getElementById('wTarget');
  if(tgt) tgt.value = (lastEdit && lastEdit.dataset.key) ? lastEdit.dataset.key : 'words';
  setTimeout(()=>inp.focus(),50);
}
document.getElementById('wInput').addEventListener('input', ()=>{
  const q=document.getElementById('wInput').value.trim();
  const sug=document.getElementById('wSuggest');
  if(!q){ sug.style.display='none'; document.getElementById('wManual').style.display='none'; document.getElementById('wPrev').classList.remove('show'); selEntry=null; return; }
  const list=queryDict(q);
  if(list.length){
    sug.innerHTML=list.map((d,i)=>`<div data-i="${i}"><b>${esc(d.w)}</b><span class="ipa">/${esc(d.ipa)}/</span><span class="m">${esc(d.pos)} ${esc(d.mean)}</span></div>`).join('');
    sug.style.display='block';
    sug.querySelectorAll('div').forEach(div=>div.onclick=()=>{
      const d=list[+div.dataset.i];
      document.getElementById('wInput').value=d.w;
      document.getElementById('wPrev').innerHTML=`<b>${esc(d.w)}</b> /${esc(d.ipa)}/ <span style="color:#8a6d3b">${esc(d.pos)}</span> ${esc(d.mean)}`;
      document.getElementById('wPrev').classList.add('show');
      sug.style.display='none';
      document.getElementById('wManual').style.display='none';
      selEntry=d;
    });
  } else {
    sug.style.display='none';
    document.getElementById('wManual').style.display='block';
    document.getElementById('wPrev').classList.remove('show');
    selEntry=null;
  }
});
document.getElementById('wConfirm').addEventListener('click', ()=>{
  const w=document.getElementById('wInput').value.trim();
  if(!w){ toast('请输入单词'); return; }
  let ipa='',pos='',mean='',save=false;
  if(selEntry){ ipa=selEntry.ipa; pos=selEntry.pos; mean=selEntry.mean; }
  else {
    ipa=document.getElementById('wIpa').value.trim();
    pos=document.getElementById('wPos').value.trim();
    mean=document.getElementById('wMean').value.trim();
    save=document.getElementById('wSave').checked;
  }
  if(save && ipa && pos && mean){ addUserWord({w,ipa,pos,mean,lv:LEVEL}); toast('已加入词库'); }
  const bg=ENTRY_BG[entryIdx++ % ENTRY_BG.length];
  const tgt=document.getElementById('wTarget');
  const tkey=tgt?tgt.value:'words';
  insertEntryHTML(`<div class="entry" style="--ec:${bg}"><span class="e-word">${esc(w)}</span><span class="e-ipa">/${esc(ipa)||'/'}/</span><span class="e-pos">${esc(pos)}</span><span class="e-mean">${esc(mean)}</span></div><p></p>`, tkey);
  closeModals();
  toast('已插入词条'+(selEntry?'（已自动匹配）':''));
});

/* 在指定模块里插入词条（跨浏览器，不再依赖 execCommand('insertHTML')，Firefox 也可用） */
modulesEl.addEventListener('focusin', e=>{ const el=e.target.closest('.mod-edit'); if(el) lastEdit=el; });
function insertAtCursor(el, html){
  el.focus();
  const sel = window.getSelection();
  let range = null;
  if(sel && sel.rangeCount){
    const r = sel.getRangeAt(0);
    if(el.contains(r.commonAncestorContainer)) range = r;
  }
  if(!range){ range = document.createRange(); range.selectNodeContents(el); range.collapse(false); } // 默认插到末尾
  range.deleteContents();
  const frag = range.createContextualFragment(html);
  const last = frag.lastChild;
  range.insertNode(frag);
  if(last){ range.setStartAfter(last); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); }
}
function insertEntryHTML(html, key){
  let el = key ? modulesEl.querySelector(`.mod-edit[data-key="${key}"]`)
              : (lastEdit || modulesEl.querySelector('.mod-edit'));
  if(!el) el = modulesEl.querySelector('.mod-edit');
  const k = el.dataset.key;
  insertAtCursor(el, html);
  cur().modules[k] = el.innerHTML; save();
}

/* —— 上传资料 + 模板/AI 解析 —— */
const fontSizeSel = document.getElementById('fontSize');
/* 下拉展开时浏览器会清掉正文选区：mousedown 这一刻选区还在，先把它存下来
   （注意这里不能 preventDefault，否则下拉列表打不开） */
fontSizeSel.addEventListener('mousedown', ()=>{
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
    const r = sel.getRangeAt(0);
    if(hostOf(r.commonAncestorContainer)) savedRange = r.cloneRange();
  }
});
function applyFontSizeToRange(range, px){
  return wrapRangeText(range, sp => { sp.style.fontSize = px + 'px'; });
}
function applyFontSize(px){
  const range = pickRange();
  if(!range){ toast('请先选中要调整字号的文字'); return; }
  const host = hostOf(range.commonAncestorContainer);
  if(!host){ toast('请先在正文或标注区选中文字'); return; }
  let spans = [];
  try{ spans = applyFontSizeToRange(range, px); }
  catch(e){ toast('该选区暂不支持，请重新选择'); return; }
  if(!spans.length){ toast('该选区暂不支持，请重新选择'); return; }
  try{ // 重新选中处理过的内容，便于连续调整
    const sel = window.getSelection();
    const r2 = document.createRange();
    r2.setStartBefore(spans[spans.length-1]);
    r2.setEndAfter(spans[0]);
    sel.removeAllRanges(); sel.addRange(r2);
    savedRange = r2.cloneRange();
  }catch(e){}
  saveHost(host);
  toast('字号已设为 '+px+'px');
}
fontSizeSel.addEventListener('change', ()=>{
  const v = fontSizeSel.value;
  if(!v) return;
  applyFontSize(parseInt(v,10));
  fontSizeSel.value = '';
});

/* 橡皮擦：擦掉选中文字（删除内容） */
document.getElementById('textEraser').addEventListener('mousedown', e=>e.preventDefault());
document.getElementById('textEraser').addEventListener('click', ()=>{
  const range = pickRange();
  if(!range){ toast('请先选中要擦除的文字'); return; }
  const host = hostOf(range.commonAncestorContainer);
  if(!host){ toast('请先在正文或标注区选中文字'); return; }
  range.deleteContents();
  saveHost(host);
  toast('已擦除选中文字');
});

/* ===== 重要符号：五角星/三角形/对勾/叉号等，插入到光标处 ===== */
function insertSymbol(ch){
  const ed = lastEdit || modulesEl.querySelector('.mod-edit');
  if(!ed){ toast('请先点击要编辑的模块'); return; }
  const sel = window.getSelection();
  let range = null;
  if(sel && sel.rangeCount){
    const r = sel.getRangeAt(0);
    if(ed.contains(r.commonAncestorContainer)) range = r;
  }
  const sp = document.createElement('span');
  sp.className = 'sym-mark';
  sp.textContent = ch;
  if(range && !range.collapsed){
    // 有选中文字时不删除原文，符号插在选区后面（避免误删单词）
    range.setEnd(range.endContainer, range.endOffset);
    range.insertNode(sp);
    range.setStartAfter(sp); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
  }else{
    if(range){ range.deleteContents(); range.insertNode(sp); range.setStartAfter(sp); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); }
    else ed.appendChild(sp);
  }
  const k = ed.dataset.key; cur().modules[k] = ed.innerHTML; save();
  toast('已插入符号 '+ch);
}
document.querySelectorAll('.tbtn.sym').forEach(b=>{
  b.addEventListener('mousedown', e=>e.preventDefault());
  b.addEventListener('click', ()=>insertSymbol(b.dataset.sym));
});

/* ===== 🔗 联动：重点词汇 → 音标 / 常见搭配 / 配套例句 / 重点语法 / 语法测试 =====
   1) 已有的 .entry 词条：补全空白的 音标 / 词性 / 释义
   2) 正文里直接输入的纯文本单词：就地包装成带音标/词性/释义的行内词条
      （音标就出现在单词所在的位置，且不重建 DOM，光标不会丢）
   3) 常见搭配 → 常见搭配模块；配套例句 → 配套例句模块
      重点语法 → 重点语法模块；语法测试 → 语法测试模块
   全部按 data-lk 标记去重，反复点不会重复添加。 */
/* 高频虚词不做成词条，避免整句话被切得七零八落 */
const STOP_WORDS = new Set(('a an the this that these those i you he she it we they me him her us them my your his its our their '
  + 'am is are was were be been being do does did have has had will would shall should can could may might must '
  + 'of to in on at for with by from and or but not no yes then than there here up down out off over under very too also just '
  + 'as if so because while until since unless although though what who which whose where when why how').split(' '));
function dictIndex(){
  const map = Object.create(null);
  getDict().forEach(d=>{
    const k = (d.w||'').toLowerCase();
    if(k && !map[k]) map[k] = d;
  });
  return map;
}
function collectModuleWords(key){
  const el = modulesEl.querySelector(`.mod-edit[data-key="${key}"]`);
  if(!el) return [];
  const out = [];
  const push = w => { w=(w||'').trim().toLowerCase(); if(w && !out.includes(w)) out.push(w); };
  el.querySelectorAll('.e-word').forEach(e=>push(e.textContent));
  el.querySelectorAll('.we-w').forEach(e=>push(e.textContent));
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let t;
  while((t = walker.nextNode())){
    if(t.parentElement && t.parentElement.closest('.entry, .wentry')) continue;
    (t.nodeValue||'').split(/[\s,.;:!?"'()（）、，。；：！？\n]+/).forEach(w=>{
      if(/^[a-z][a-z'-]*$/.test(w) && w.length>1) push(w);
    });
  }
  return out;
}
function hasLinkMark(key, mark){
  const el = modulesEl.querySelector(`.mod-edit[data-key="${key}"]`);
  if(!el) return false;
  return !!el.querySelector('[data-lk="'+mark+'"]');
}
function appendModuleLine(key, html){
  const el = modulesEl.querySelector(`.mod-edit[data-key="${key}"]`);
  if(!el) return false;
  el.insertAdjacentHTML('beforeend', html);
  const n = cur();
  if(n) n.modules[key] = el.innerHTML;
  return true;
}
/* ===== 安全护栏：只动"单词表段落"，绝不碰例句/散文 =====
   判据（全部满足才算单词表）：
     · 整段没有句子标点（. , ; : ! ? 及中文标点）
     · 段内每个英文单词都在词库里（句子里常有 reading/books 这类不在词库的词）
     · 至少有一个英文单词
   这样 "apple banana orange" 是单词表（可加音标），
   而 "I like reading books in the library." 永远不是（绝不会被动）。 */
function blockOf(node, host){
  let el = node.nodeType===1 ? node : node.parentElement;
  while(el && el !== host){
    if(el.parentElement === host) return el;   /* host 的直接子级块 */
    el = el.parentElement;
  }
  return host;
}
/* 取块的"纯词"文本：包含音标卡里的单词本身，但不包含音标/词性/释义，
   也不包含正式词条卡(.entry)里的内容 */
function blockPlainText(block){
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  const out = [];
  let t;
  while((t = walker.nextNode())){
    const p = t.parentElement;
    if(p && p.closest){
      if(p.closest('.entry')) continue;                       /* 正式词条卡 */
      if(p.closest('.we-ipa, .we-pos, .we-mean')) continue;   /* 音标卡的附加信息 */
    }
    out.push(t.nodeValue || '');
  }
  return out.join(' ').replace(/\u00a0/g,' ').trim();
}
function isWordListBlock(block, byKey){
  const txt = blockPlainText(block);
  if(!txt) return false;
  if(/[.!?;:,，。！？；：]/.test(txt)) return false;   /* 有句子标点 → 是句子 */
  const toks = txt.split(/\s+/).filter(Boolean);
  if(!toks.length) return false;
  let n = 0;
  for(const t of toks){
    const w = t.toLowerCase();
    if(!/^[a-z][a-z'-]*$/.test(w)) continue;   /* 中文注释等，忽略 */
    if(!byKey[w]) return false;                /* 有不在词库的词 → 是句子 */
    n++;
  }
  return n > 0;
}
/* 把「重点词汇」里纯文本的英文单词，就地包装成带音标/词性/释义的行内词条。
   ★ 只在"单词表段落"里做；例句、散文段落一律跳过，绝不破坏句子结构。
   ★ 只处理"已经写完"的词（后面跟着非字母，或已不在光标所在的文本节点里）。
   全程用 splitText/insertBefore（DOM 会自动维护光标位置），不重建 DOM。
   返回 {count, words} —— words 是本次新加音标的词，供自动联动精确投递。 */
function wrapPlainWords(host, manual){
  if(!host) return {count:0, words:[]};
  const byKey = dictIndex();
  const sel = window.getSelection();
  const caretNode = (sel && sel.rangeCount && sel.getRangeAt(0).startContainer.nodeType===3)
                  ? sel.getRangeAt(0).startContainer : null;
  const caretOff = (sel && sel.rangeCount && sel.getRangeAt(0).startContainer.nodeType===3)
                  ? sel.getRangeAt(0).startOffset : -1;
  const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let t;
  while((t = walker.nextNode())) nodes.push(t);
  const jobs = [];
  nodes.forEach(node=>{
    if(!node.nodeValue) return;
    const p = node.parentElement;
    if(p && p.closest && p.closest('.entry, .wentry')) return;   /* 已经是词条了 */
    const txt = node.nodeValue;
    const re = /[A-Za-z][A-Za-z'-]*/g;
    let m;
    while((m = re.exec(txt))){
      const word = m[0], key = word.toLowerCase();
      if(STOP_WORDS.has(key)) continue;
      const d = byKey[key];
      if(!d) continue;
      const end = m.index + word.length;
      let terminated;
      if(end < txt.length) terminated = !/[A-Za-z]/.test(txt[end]);
      else if(node !== caretNode) terminated = true;
      /* 光标正停在这个词上：
         · 自动联动 → 认为还没写完，等打出空格/回车再处理
         · 手动点「🔗 联动」→ 老师已明确要求，光标在词尾也算写完 */
      else terminated = !!(manual && caretOff >= end);
      if(!terminated) continue;
      jobs.push({node:node, start:m.index, end:end, word:word, d:d});
    }
  });
  if(!jobs.length) return {count:0, words:[]};
  /* ★ 关键护栏：只保留"单词表段落"里的词，其余（例句/散文）直接跳过 */
  const safe = jobs.filter(jb => isWordListBlock(blockOf(jb.node, host), byKey));
  if(!safe.length) return {count:0, words:[]};
  let count = 0;
  const words = [];
  for(let i = safe.length-1; i >= 0; i--){          /* 从后往前，避免前面的偏移失效 */
    const jb = safe[i];
    const node = jb.node;
    if(!node.parentNode) continue;
    if(jb.end > (node.nodeValue||'').length) continue;
    node.splitText(jb.end);
    const mid = node.splitText(jb.start);           /* mid = 单词本身 */
    if(!mid || !mid.parentNode) continue;
    const wrap = document.createElement('span');
    wrap.className = 'wentry';
    wrap.style.setProperty('--ec', ENTRY_BG[count % ENTRY_BG.length]);
    const weW = document.createElement('span'); weW.className = 'we-w';
    const weI = document.createElement('span'); weI.className = 'we-ipa'; weI.textContent = '/'+jb.d.ipa+'/';
    const weP = document.createElement('span'); weP.className = 'we-pos'; weP.textContent = jb.d.pos;
    const weM = document.createElement('span'); weM.className = 'we-mean'; weM.textContent = jb.d.mean;
    mid.parentNode.insertBefore(wrap, mid);
    wrap.appendChild(weW); weW.appendChild(mid);
    wrap.appendChild(weI); wrap.appendChild(weP); wrap.appendChild(weM);
    count++;
    words.push(jb.word.toLowerCase());
  }
  return {count:count, words:words};
}
/* 把某个单词的搭配/例句/语法/测试分别送入对应模块（按 data-lk 标记去重） */
function pushLink(word, res, withGram){
  const lk = LINK_DATA[word];
  if(lk && lk[0]){
    const mark = word+'|co';
    if(!hasLinkMark('collo', mark) && appendModuleLine('collo', '<p data-lk="'+mark+'">'+esc(lk[0])+'</p>')) res.collo++;
  }
  if(lk && lk[1]){
    const mark = word+'|ex';
    if(!hasLinkMark('ex', mark) && appendModuleLine('ex', '<p data-lk="'+mark+'">'+esc(lk[1])+'</p>')) res.ex++;
  }
  if(withGram){
    const g = GRAM_DATA[word];
    if(g){
      const gm = word+'|g', tm = word+'|t';
      if(!hasLinkMark('gram', gm) && appendModuleLine('gram', '<p data-lk="'+gm+'">'+esc(g[0])+'</p>')) res.gram++;
      if(!hasLinkMark('test', tm) && appendModuleLine('test', '<p data-lk="'+tm+'">'+esc(g[1])+'</p>')) res.test++;
    }
  }
}
/* 联动主流程：既处理已有词条，也处理纯文本单词，并把资料送到其它四个模块。
   全部"就地更新"，不调用 renderMain()，所以光标和焦点都不会丢。 */
function linkModules(opts){
  opts = opts || {};
  const n = cur();
  if(!n) return;
  const host = modulesEl.querySelector('.mod-edit[data-key="words"]');
  if(!host){ toast('未找到重点词汇模块'); return; }
  const byKey = dictIndex();
  const res = {ipa:0, collo:0, ex:0, gram:0, test:0};
  /* 1) 已有 .entry 词条：补全空白的 音标 / 词性 / 释义 */
  host.querySelectorAll('.entry').forEach(en=>{
    const we = en.querySelector('.e-word');
    const w = we ? (we.textContent||'').trim().toLowerCase() : '';
    const d = byKey[w];
    if(!d) return;
    const ie = en.querySelector('.e-ipa'), pe = en.querySelector('.e-pos'), me = en.querySelector('.e-mean');
    if(ie && !ie.textContent.trim()){ ie.textContent = '/'+d.ipa+'/'; res.ipa++; }
    if(pe && !pe.textContent.trim()){ pe.textContent = d.pos; res.ipa++; }
    if(me && !me.textContent.trim()){ me.textContent = d.mean; res.ipa++; }
  });
  /* 2) 纯文本单词：就地包装成带音标的行内词条（音标就在单词所在位置）
     —— 只在"单词表段落"里做，例句/散文不会被切碎 */
  const wrapped = wrapPlainWords(host, true);
  res.ipa += wrapped.count;
  /* 3) 配套资料：分别送到四个模块 */
  collectModuleWords('words').forEach(w=>pushLink(w, res, true));
  n.modules.words = host.innerHTML;
  save();
  const parts = [];
  if(res.ipa) parts.push('补全 '+res.ipa+' 处音标/词性/释义');
  if(res.collo) parts.push('新增 '+res.collo+' 条搭配');
  if(res.ex) parts.push('新增 '+res.ex+' 条例句');
  if(res.gram) parts.push('新增 '+res.gram+' 条语法');
  if(res.test) parts.push('新增 '+res.test+' 道测试');
  if(!opts.silent) toast(parts.length ? ('已联动：'+parts.join('，')) : '没有可联动的新内容');
}
document.getElementById('linkBtn').addEventListener('click', ()=>linkModules());

/* ===== ↩ 还原：把自动加上的音标卡拆回纯文本、删掉联动自动添加的内容 =====
   用于救回被 v9 的"自动联动"改坏的笔记（例句被切碎、其它模块被灌水）。
   纯文本还原后原词完全保留，音标/词性/释义一并去掉。 */
function restorePlainText(){
  const box = document.createElement('div');
  let chips = 0, lines = 0;
  notes.forEach(nt=>{
    if(!nt.modules) return;
    Object.keys(nt.modules).forEach(k=>{
      const html = nt.modules[k] || '';
      if(!html) return;
      box.innerHTML = html;
      let changed = false;
      box.querySelectorAll('.wentry').forEach(w=>{
        const we = w.querySelector('.we-w');
        w.parentNode.replaceChild(document.createTextNode(we ? we.textContent : w.textContent), w);
        chips++; changed = true;
      });
      box.querySelectorAll('[data-lk]').forEach(p=>{ p.remove(); lines++; changed = true; });
      if(changed) nt.modules[k] = box.innerHTML;
    });
  });
  save();
  renderMain();
  if(chips || lines) toast('已还原：'+chips+' 处音标标记、'+lines+' 条联动内容');
  else toast('没有需要还原的内容');
}
document.getElementById('restoreBtn').addEventListener('click', ()=>{
  if(confirm('确定把所有便签里的「自动音标卡」和「联动自动添加的内容」全部还原吗？\n\n（只去掉自动生成的部分，你自己写的内容会保留）')) restorePlainText();
});

/* ===== ⚡ 自动联动：在「重点词汇」里输入单词后即时匹配并送到其它模块 ===== */
const AUTO_LINK_KEY = 'wb-autolink';
let autoLinkOn = true;
try{ autoLinkOn = localStorage.getItem(AUTO_LINK_KEY) !== '0'; }catch(_){}
function setAutoLink(on){
  autoLinkOn = on;
  try{ localStorage.setItem(AUTO_LINK_KEY, on ? '1' : '0'); }catch(_){}
  const b = document.getElementById('autoLinkBtn');
  if(b){ b.classList.toggle('on', on); b.textContent = on ? '⚡ 自动联动' : '⚡ 自动联动·关'; }
}
/* 只有"老师真的输入过"才自动联动 —— 否则点进模块再点走也会把内容改坏 */
let wordsDirty = false;
function autoLinkStep(host){
  if(!autoLinkOn || !host || !host.isConnected) return;
  if(!wordsDirty) return;                 /* 没输入过 → 不动 */
  const n = cur();
  if(!n) return;
  const res = {ipa:0, collo:0, ex:0, gram:0, test:0};
  const wrapped = wrapPlainWords(host, false);
  wordsDirty = false;
  if(!wrapped.count) return;
  res.ipa += wrapped.count;
  /* 只把"本次新加音标的词"送到其它模块 —— 不再把例句里的词也当成重点词汇灌进去 */
  wrapped.words.forEach(w=>pushLink(w, res, false));
  n.modules.words = host.innerHTML;
  save();
  const parts = [];
  if(res.ipa) parts.push(res.ipa+' 个词已标出音标/词性/释义');
  if(res.collo) parts.push(res.collo+' 条搭配');
  if(res.ex) parts.push(res.ex+' 条例句');
  toast('⚡ '+parts.join('，'));
}
setAutoLink(autoLinkOn);
document.getElementById('autoLinkBtn').addEventListener('click', ()=>{
  setAutoLink(!autoLinkOn);
  toast(autoLinkOn ? '已开启自动联动：输入单词即匹配音标并联动其它模块' : '已关闭自动联动，可点「🔗 联动」手动执行');
});
/* 用 input 事件触发（键盘输入、粘贴、输入法都能覆盖），停顿 0.8 秒后处理 */
let autoLinkTimer = null;
modulesEl.addEventListener('input', e=>{
  if(!autoLinkOn) return;
  const mod = e.target.closest && e.target.closest('.mod-edit[data-key="words"]');
  if(!mod) return;
  wordsDirty = true;                       /* 记录"老师确实输入过" */
  clearTimeout(autoLinkTimer);
  autoLinkTimer = setTimeout(()=>autoLinkStep(mod), 800);
});
/* 离开「重点词汇」时立即补齐（把刚打完的最后一个词也处理掉） */
modulesEl.addEventListener('focusout', e=>{
  if(!autoLinkOn) return;
  const mod = e.target.closest && e.target.closest('.mod-edit[data-key="words"]');
  if(!mod) return;
  clearTimeout(autoLinkTimer);
  setTimeout(()=>autoLinkStep(mod), 80);
}, true);

/* ===== 全屏演示 / 编辑模式切换 ===== */
const fsBtn = document.getElementById('fsBtn');
const fsExit = document.getElementById('fsExit');
function setFullscreen(on){
  document.body.classList.toggle('fs-mode', on);
  fsBtn.classList.toggle('active', on);
  fsBtn.textContent = on ? '⛶ 退出全屏' : '⛶ 全屏';
  if(on){ toast('已进入全屏演示，按 Esc 或点右上角返回'); }
  else { toast('已返回编辑模式'); }
  setTimeout(renderAnno, 60);
}
fsBtn.addEventListener('click', ()=>setFullscreen(!document.body.classList.contains('fs-mode')));
fsExit.addEventListener('click', ()=>setFullscreen(false));
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.body.classList.contains('fs-mode')) setFullscreen(false);
});

document.getElementById('uploadBtn').addEventListener('click', ()=>{
  const m=document.getElementById('upMask'); m.classList.add('show');
  document.getElementById('upHint').textContent='支持 .docx / .pdf，文本在浏览器本地解析，不会上传到第三方。资料会作为「参考资料」保存，可按模板或 AI 自动补齐下方五大模块。';
  upText='';
});
document.getElementById('upSeg').addEventListener('click', e=>{
  const b=e.target.closest('button[data-lv]'); if(!b) return;
  upLevel=b.dataset.lv;
  document.querySelectorAll('#upSeg button').forEach(x=>x.classList.toggle('on', x===b));
});
document.getElementById('upFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const hint=document.getElementById('upHint');
  const nameEl=document.getElementById('upFileName');
  if(nameEl) nameEl.textContent = '已选：'+f.name;
  try{
    if(typeof mammoth==='undefined'){ hint.textContent='解析库未加载（需联网加载 mammoth.js），请联网后重试。'; return; }
    if(f.name.endsWith('.docx')){
      const arr=await f.arrayBuffer();
      const res=await mammoth.extractRawText({arrayBuffer:arr});
      upText=res.value;
    } else if(f.name.endsWith('.pdf')){
      if(typeof pdfjsLib==='undefined'){ hint.textContent='解析库未加载（需联网加载 pdf.js），请联网后重试。'; return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const buf=await f.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      let t='';
      for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); t+=c.items.map(it=>it.str).join(' ')+'\n'; }
      upText=t;
    } else { toast('仅支持 .docx / .pdf'); return; }
    hint.textContent=`已读取「${f.name}」，约 ${upText.length} 字。`;
    saveRef(f.name, upLevel);
  }catch(err){ hint.textContent='解析失败：'+err.message; }
});
document.getElementById('upParse').addEventListener('click', ()=>{
  if(!upText){ toast('请先选择文件'); return; }
  const parsed=parseTemplate(upText);
  const map={words:'words',collo:'collo',gram:'gram',ex:'ex',test:'test'};
  let filled=0;
  for(const k in map){ if(parsed[k]){ fillModule(map[k], fmtSeg(parsed[k])); filled++; } }
  if(filled>0){ closeModals(); toast(`已按模板补齐 ${filled} 个模块`); return; }
  const llm=getLLM();
  if(llm.base){ aiFill(upText, upLevel); }
  else { closeModals(); toast('未识别到【重点词汇】等模板标记；请在「设置」配置大模型，或按模板整理资料后再上传。'); }
});

function parseTemplate(text){
  const labels={words:['重点词汇','词汇'],collo:['常见搭配','搭配'],gram:['重点语法','语法'],ex:['配套例句','例句'],test:['语法测试','测试']};
  const idx=[];
  for(const k in labels){ labels[k].forEach(l=>{
    const rg=new RegExp('【'+l+'】|##\\s*'+l,'g'); let m;
    while((m=rg.exec(text))!==null){ idx.push({pos:m.index,k,len:m[0].length}); }
  }); }
  idx.sort((a,b)=>a.pos-b.pos);
  const out={};
  idx.forEach((it,i)=>{
    const start=it.pos+it.len;
    const end= i+1<idx.length ? idx[i+1].pos : text.length;
    let seg=text.slice(start,end).trim();
    if(!out[it.k]) out[it.k]=seg;
  });
  return out;
}
function fmtSeg(seg){
  return seg.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join('');
}
function fillModule(key, html){
  const el=modulesEl.querySelector(`.mod-edit[data-key="${key}"]`);
  el.innerHTML=html; cur().modules[key]=html; save();
}

/* —— AI 解析（OpenAI 兼容接口） —— */
function getLLM(){ try{ return JSON.parse(localStorage.getItem('wb-llm')||'{}'); }catch(e){ return {}; } }
async function aiFill(text, level){
  const llm=getLLM();
  const lvName=level==='pep'?'小学（人教PEP）':'初中（外研版）';
  const prompt=`你是${lvName}英语教研助手。下面是一段教学或试卷资料文本。请提取并整理为五个部分，严格只返回 JSON（不要任何多余文字、不要代码块标记）：{"words":"重点词汇，每行格式：单词 /音标/ 词性 释义","collocations":"常见搭配","grammar":"重点语法","examples":"配套例句（含中文译文）","test":"语法测试（含题目与参考答案）"}。\n\n资料：\n`+text.slice(0,6000);
  closeModals(); toast('AI 解析中…');
  try{
    const res=await fetch(llm.base.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+llm.key},
      body:JSON.stringify({model:llm.model,messages:[{role:'user',content:prompt}],temperature:0.3,response_format:{type:'json_object'}})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    let c=j.choices[0].message.content.replace(/```json|```/g,'').trim();
    const obj=JSON.parse(c);
    const map={words:'words',collocations:'collo',grammar:'gram',examples:'ex',test:'test'};
    let n=0;
    for(const k in map){ if(obj[k]){ fillModule(map[k], fmtSeg(obj[k])); n++; } }
    toast('AI 已补齐 '+n+' 个模块');
  }catch(err){ toast('AI 解析失败：'+err.message+'（请检查接口地址/密钥/CORS）'); }
}

/* —— 设置（大模型接口） —— */
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  const m=document.getElementById('setMask'); m.classList.add('show');
  const llm=getLLM();
  document.getElementById('setBase').value=llm.base||'';
  document.getElementById('setKey').value=llm.key||'';
  document.getElementById('setModel').value=llm.model||'';
});
document.getElementById('setSave').addEventListener('click', ()=>{
  const llm={base:document.getElementById('setBase').value.trim(),key:document.getElementById('setKey').value.trim(),model:document.getElementById('setModel').value.trim()};
  localStorage.setItem('wb-llm', JSON.stringify(llm));
  closeModals(); toast(llm.base?'大模型接口已保存':'已清空，将仅使用模板解析');
});

/* —— 参考资料列表 —— */
function saveRef(name, lv){
  let refs=[]; try{ refs=JSON.parse(localStorage.getItem('wb-refs')||'[]'); }catch(e){}
  refs.unshift({name, lv, ts:Date.now()});
  refs=refs.slice(0,20);
  localStorage.setItem('wb-refs', JSON.stringify(refs));
  renderRefs();
}
function renderRefs(){
  const panel=document.getElementById('refPanel');
  const list=document.getElementById('refList');
  let refs=[]; try{ refs=JSON.parse(localStorage.getItem('wb-refs')||'[]'); }catch(e){}
  if(!refs.length){ panel.classList.remove('show'); list.innerHTML=''; return; }
  panel.classList.add('show');
  list.innerHTML=refs.map((r,i)=>`<div class="ref-item"><span class="tag ${r.lv}">${r.lv==='pep'?'小学':'初中'}</span><span class="nm">${esc(r.name)}</span><span class="del" data-i="${i}">删除</span></div>`).join('');
  list.querySelectorAll('.del').forEach(d=>d.onclick=()=>{
    refs.splice(+d.dataset.i,1); localStorage.setItem('wb-refs', JSON.stringify(refs)); renderRefs();
  });
}
renderRefs();
